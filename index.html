<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  
  <!-- 기본 메타 -->
  <title>언니맵 - 언니가 언니를 위해</title>
  <meta name="description" content="언니가 언니를 위해 화장실 정보를 나눠요. 깨끗한 화장실, 다 함께 공유해요!" />
  
  <!-- PWA 설정 -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#FF6B9D" />
  
  <!-- iOS PWA 설정 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="언니맵" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  
  <!-- 오픈그래프 (X/카톡 공유 시) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="언니맵 - 언니가 언니를 위해" />
  <meta property="og:description" content="화장실 정보 공유 서비스. 깨끗한 화장실, 다 함께 공유해요!" />
  <meta property="og:image" content="/icon-512.png" />
  <meta property="og:locale" content="ko_KR" />
  
  <!-- 트위터 카드 -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="언니맵" />
  <meta name="twitter:description" content="언니가 언니를 위해 화장실 정보를 나눠요" />
  <meta name="twitter:image" content="/icon-512.png" />
  
  <!-- 폰트 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
  
  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
      background: #FAFAFA;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }
    #root {
      height: 100vh;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <!-- React 앱 진입점 -->
  <script type="module" src="/src/main.jsx"></script>
  
  <!-- Service Worker 등록 -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("/service-worker.js")
          .then((reg) => console.log("✅ SW registered:", reg.scope))
          .catch((err) => console.log("❌ SW failed:", err));
      });
    }
  </script>
</body>
</html>
